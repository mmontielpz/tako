[package]
name = "tako-bridge"
version = "0.0.1"
edition = "2021"
description = "Typed command layer between the TAKO desktop UI and the engine"
license = "Apache-2.0"
publish = false

[features]
# Isolated auth-only local preview. Never a release/cutover feature.
provider-auth-preview = []
# Offline native GUI qualification only; rejected in release builds.
native-qualification = []

[dependencies]
tako-engine = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reuse the workspace's existing libc for descriptor-relative, no-symlink context reads.
libc = "0.2"
sha2 = { version = "=0.11.1", default-features = false }
